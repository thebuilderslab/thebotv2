name: Bot Nation Agent Self-Deploy

# Triggered by the Worker when agent-build-lead submits a code change.
# Flow:
#   1. Worker stores change in D1 (code_changes table)
#   2. Worker fires repository_dispatch with { change_id, chat_id, task_id }
#   3. This workflow fetches the change, applies files, commits, deploys
#   4. Reports back to Telegram with success/failure

on:
  repository_dispatch:
    types: [bot-nation-deploy]

jobs:
  deploy:
    name: Apply + Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}   # PAT with contents:write (not the default GITHUB_TOKEN)
          fetch-depth: 1

      # ── 2. Setup Node ─────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/backend-api/package-lock.json

      # ── 3. Fetch change from Worker API ──────────────────────────────────────
      - name: Fetch change details
        id: fetch_change
        run: |
          CHANGE_ID="${{ github.event.client_payload.change_id }}"
          API_BASE="https://bot-nation-api.thejamalshackleford.workers.dev"
          SECRET="${{ secrets.DEPLOY_WEBHOOK_SECRET }}"

          RESPONSE=$(curl -s -f \
            -H "x-deploy-secret: $SECRET" \
            "$API_BASE/api/build/change/$CHANGE_ID")

          echo "response=$RESPONSE" >> $GITHUB_OUTPUT
          echo "Change fetched: $(echo $RESPONSE | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('commit_message','?'))")"

      # ── 4. Apply file changes ─────────────────────────────────────────────────
      - name: Apply file changes
        run: |
          CHANGE_ID="${{ github.event.client_payload.change_id }}"
          API_BASE="https://bot-nation-api.thejamalshackleford.workers.dev"
          SECRET="${{ secrets.DEPLOY_WEBHOOK_SECRET }}"

          python3 - <<'PYEOF'
          import urllib.request, json, os, base64

          change_id = os.environ.get("CHANGE_ID")
          api_base  = os.environ.get("API_BASE")
          secret    = os.environ.get("SECRET")

          req = urllib.request.Request(
              f"{api_base}/api/build/change/{change_id}",
              headers={"x-deploy-secret": secret}
          )
          with urllib.request.urlopen(req) as r:
              data = json.loads(r.read())

          for f in data["files"]:
              path    = f["path"]
              content = f["content"]
              os.makedirs(os.path.dirname(path) if os.path.dirname(path) else ".", exist_ok=True)
              with open(path, "w", encoding="utf-8") as fh:
                  fh.write(content)
              print(f"  wrote: {path}")

          print(f"Applied {len(data['files'])} file(s)")
          PYEOF
        env:
          CHANGE_ID: ${{ github.event.client_payload.change_id }}
          API_BASE: "https://bot-nation-api.thejamalshackleford.workers.dev"
          SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}

      # ── 5. Install deps ───────────────────────────────────────────────────────
      - name: Install dependencies
        working-directory: packages/backend-api
        run: npm ci --prefer-offline

      # ── 6. Deploy to Cloudflare Workers ──────────────────────────────────────
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/backend-api
          command: deploy

      # ── 7. Commit and push the change ─────────────────────────────────────────
      - name: Commit changes
        run: |
          git config user.name  "bot-nation-agent[bot]"
          git config user.email "agent@botnation.ai"
          git add -A
          git diff --staged --quiet || git commit -m "${{ github.event.client_payload.commit_message }}"
          git push

      # ── 8. Mark change as deployed in D1 ────────────────────────────────────
      - name: Mark deployed
        if: success()
        run: |
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -H "x-deploy-secret: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}" \
            -d '{"status":"deployed","run_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            "https://bot-nation-api.thejamalshackleford.workers.dev/api/build/change/${{ github.event.client_payload.change_id }}/status"

      # ── 9. Notify Telegram — success ─────────────────────────────────────────
      - name: Telegram success
        if: success()
        run: |
          MSG="✅ <b>Deploy complete</b>%0A"
          MSG+="${{ github.event.client_payload.commit_message }}%0A"
          MSG+="Task: <code>${{ github.event.client_payload.task_id }}</code>%0A"
          MSG+="<a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>View run</a>"

          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${{ github.event.client_payload.chat_id }}\",\"text\":\"$MSG\",\"parse_mode\":\"HTML\"}"

      # ── 10. Notify Telegram — failure ────────────────────────────────────────
      - name: Telegram failure
        if: failure()
        run: |
          MSG="❌ <b>Deploy failed</b>%0A"
          MSG+="${{ github.event.client_payload.commit_message }}%0A"
          MSG+="<a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>See error log</a>"

          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${{ github.event.client_payload.chat_id }}\",\"text\":\"$MSG\",\"parse_mode\":\"HTML\"}"
